# 当前 Navcar 雷达坐标平移导航模板。复制为 robot.yaml 后填写实测几何。
# 不用于 configure.py / bringup.py 的旧 JSONL 入口。
version: 1
robot:
  across_flats_m: 0.510       # 正八边形对边距，含全部轮子和突出物；测量记录
  circumscribed_radius_m: 0.276011 # 0.510/(2*cos(pi/8)) 向上取整到微米；优先于长宽
  length_m: null             # 含轮子、突出支架的实际碰撞长度，m，待测
  width_m: null              # 实际碰撞宽度，m，待测
  lidar_bottom_height_m: 0.280 # 雷达底面离地高度，已确认；不可直接作为光心高度
  lidar_height_m: 0.327      # 点云原点离地 = 底面 0.280 + 官方尺寸图 0.047，水平正装
yaw:
  axis_xyz_m: [0.0, 0.0, 0.280] # yaw 安装面与雷达底面同高；轴线在车体中心
  lidar_offset_radius_m: 0.01418 # 光学中心到 yaw 轴的水平偏心长度，与下方向量互相校验
  lidar_offset_xy_m: [-0.01418, 0.0] # 从 yaw 轴指向光心，以雷达 x 前、y 左表示，已确认
  imu_xyz_m: [null, null, null]   # 旧模式字段；光学偏心模式使用 LIO 内部外参，不填假值
  imu_rpy_rad: [null, null, null] # 内置 IMU 相对云台的安装角，rad，待测；当前要求水平
navigation:
  max_speed_mps: 0.3         # 导航合成移速上限，Nav2 / 转发 / 8081 共用；全局最高 0.3
  reference_point: yaw_axis # 原点在真实 yaw 轴上，轴向跟随雷达；不冒充实际底盘航向
# yaw 目标在 serial.navcar.yaml 的 yaw_target_deg 中配置，单位为度。
# 下位机回显的 yaw 目标不是实际关节角；当前使用整车包围圆，不构造假的关节 TF。
pending:
  measured_collision_height_m: null
  yaw_lock_accuracy_deg: null
  yaw_mechanical_limits_rad: null
  measured_yaw_or_chassis_heading_feedback: 待定
  narrowest_passage_width_m: null
  near_field_self_points: 待测
  stopping_distance_m: null
  localization_error_m: null
