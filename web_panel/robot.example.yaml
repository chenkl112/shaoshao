# 复制为 robot.yaml 后填写。null/待测 均表示未知，实车启动前必须补全必填项。
version: 1
robot:
  length_m: null             # 含轮子、突出支架的碰撞长度，待测
  width_m: null              # 碰撞宽度，待测
  lidar_height_m: null       # 光学中心离地高度，待测
yaw:
  reference: 待测            # 本版支持 base_link：保持相对底盘固定角
  target_rad: null           # 闭环保持角，按标定后的关节零位，待测
  axis_xyz_m: [null, null, null]  # yaw 旋转轴原点在 base_link 中的位置，待测
  imu_xyz_m: [null, null, null]   # 内置 IMU 在 yaw_link 中的位置，待测
  imu_rpy_rad: [null, null, null] # 内置 IMU 相对 yaw_link 的安装角，待测
  joint_name: yaw_joint
  angle_tolerance_rad: 0.02  # 约 1.15°，起始门控容差，需实测调整
  rate_tolerance_rad_s: 0.03
  feedback_timeout_s: 0.3
  settle_time_s: 0.5
network:
  host_ip: null              # 雷达专用网口 IP，待测
  lidar_ip: null             # MID360 实际 IP，待测
hardware:
  transport: serial_jsonl_v1  # 已选定参考串口协议；下位机由底盘负责人实现
  driver_command: []         # 已有 ROS 驱动的启动命令数组，待测；也可单独启动
  serial_port: null          # 例如 /dev/serial/by-id/...，待测
  baud: null                 # 与下位机一致，待测
  yaw_encoder_sign: null     # 原始编码器转 ROS 关节正方向，+1/-1，串口方案必填
  yaw_encoder_zero_rad: null # 原始编码器对应关节零位的读数，串口方案必填
  command_timeout_s: 0.3
# 以下作为待测记录，不会被当成真实值写入轮速控制器。
pending:
  ubuntu_ros_version: 待测
  controller_model_and_protocol: 控制板型号待测；协议已选 serial_jsonl_v1
  wheel_radius_m: null
  half_wheelbase_m: null
  half_track_m: null
  roller_layout: 待测
  gear_ratio: null
  encoder_ticks_per_revolution: null
  motor_directions: 待测
  yaw_pid_and_current_limits: 待测
  yaw_mechanical_limits_rad: 待测
